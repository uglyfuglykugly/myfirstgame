<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Storm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#game{display:block;background:linear-gradient(#4d7047,#263b25);width:100vw;height:100vh;cursor:crosshair}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:bold}.panel{background:#0008;padding:10px 14px;border-radius:10px}#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0009;padding:9px 14px;border-radius:10px;text-align:center;font-size:14px}#start{position:fixed;inset:0;display:grid;place-items:center;background:#000b}#card{max-width:440px;margin:20px;padding:28px;background:#182018;border:1px solid #5c7;border-radius:18px;text-align:center}button{font-size:18px;font-weight:bold;padding:12px 24px;border:0;border-radius:10px;background:#e8c44a;cursor:pointer}h1{margin-top:0}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel">❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="ammo">12</span></div><div class="panel">Wave <span id="wave">1</span> &nbsp; Zombies: <span id="count">0</span> &nbsp; Score: <span id="score">0</span></div></div>
<div id="help">WASD = bewegen · muis = richten · klik = schieten · R = herladen</div>
<div id="start"><div id="card"><h1>🧟 ZOMBIE STORM</h1><p>Overleef zoveel mogelijk golven zombies. Jij hebt een pistool; de zombies vallen alleen aan met hun handen.</p><button id="play">START GAME</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,keys={},mouse={x:0,y:0},player,zombies=[],bullets=[],wave=1,score=0,running=false,last=0,spawned=0,kills=0,shootCooldown=0,reloading=false;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',()=>shoot());
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';start()};
function start(){player={x:W/2,y:H/2,r:17,hp:100,ammo:12,maxAmmo:12,speed:260};zombies=[];bullets=[];wave=1;score=0;kills=0;spawned=0;running=true;last=performance.now();requestAnimationFrame(loop)}
function spawn(){let side=Math.floor(Math.random()*4),px=side===0?Math.random()*W:side===1?W:side===2?Math.random()*W:0,py=side===0?0:side===1?Math.random()*H:side===2?H:Math.random()*H;zombies.push({x:px,y:py,r:16+Math.random()*6,hp:40+wave*7,speed:45+Math.random()*25+wave*3,hit:0})}
function shoot(){if(!running||reloading||shootCooldown>0)return;if(player.ammo<=0){reload();return}let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*720,vy:Math.sin(a)*720,r:4,life:1});player.ammo--;shootCooldown=.16}
function reload(){if(!running||reloading||player.ammo===player.maxAmmo)return;reloading=true;setTimeout(()=>{player.ammo=player.maxAmmo;reloading=false},700)}
function update(dt){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(18,Math.min(W-18,player.x+dx/l*player.speed*dt));player.y=Math.max(18,Math.min(H-18,player.y+dy/l*player.speed*dt));shootCooldown=Math.max(0,shootCooldown-dt);
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const z of zombies){if(z.hp>0&&Math.hypot(b.x-z.x,b.y-z.y)<z.r+b.r){z.hp-=35;b.life=0;if(z.hp<=0){score+=10;kills++}}}}
bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const z of zombies){if(z.hp<=0)continue;let a=Math.atan2(player.y-z.y,player.x-z.x),d=Math.hypot(player.x-z.x,player.y-z.y);if(d>z.r+player.r-3){z.x+=Math.cos(a)*z.speed*dt;z.y+=Math.sin(a)*z.speed*dt}else{z.hit-=dt;if(z.hit<=0){player.hp-=8;z.hit=.55}}}zombies=zombies.filter(z=>z.hp>0);if(player.hp<=0){running=false;document.getElementById('card').innerHTML='<h1>☠️ GAME OVER</h1><p>Score: '+score+' · Golven: '+wave+'</p><button id="play">OPNIEUW</button>';document.getElementById('start').style.display='grid';document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';start()}}
let target=wave*5;if(spawned<target){spawn();spawned++}else if(zombies.length===0){wave++;spawned=0}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#33512f';for(let i=0;i<70;i++){let px=(i*137)%W,py=(i*83)%H;x.fillStyle=i%2?'#3b5d35':'#29452a';x.fillRect(px,py,3,3)}
for(const b of bullets){x.fillStyle='#ffe36e';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}
for(const z of zombies){x.save();x.translate(z.x,z.y);x.fillStyle='#6c9b54';x.beginPath();x.arc(0,0,z.r,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(-5,-3,3,0,7);x.arc(5,-3,3,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.moveTo(-6,7);x.lineTo(6,7);x.stroke();x.restore()}
let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);x.save();x.translate(player.x,player.y);x.rotate(a);x.fillStyle='#4a77c9';x.beginPath();x.arc(0,0,player.r,0,7);x.fill();x.fillStyle='#333';x.fillRect(7,-5,25,10);x.fillStyle='#ddd';x.fillRect(27,-4,9,8);x.restore();
}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('ammo').textContent=reloading?'...':player.ammo;document.getElementById('wave').textContent=wave;document.getElementById('count').textContent=zombies.length;document.getElementById('score').textContent=score;requestAnimationFrame(loop)}
</script></body></html>
