<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Storm</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#game{display:block;background:linear-gradient(#4d7047,#263b25);width:100vw;height:100vh;cursor:crosshair}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:bold}.panel{background:#0009;padding:10px 14px;border-radius:10px}#shop{position:fixed;top:62px;right:12px;width:270px;background:#000b;padding:12px;border-radius:12px;z-index:3;max-height:80vh;overflow:auto}#shop h2{margin:0 0 8px;font-size:18px}#skins{display:grid;grid-template-columns:1fr 1fr;gap:7px}.skin{padding:8px;background:#222;border:1px solid #555;border-radius:9px;cursor:pointer;text-align:center}.skin:hover{background:#333}.face{width:42px;height:42px;border-radius:50%;margin:0 auto 5px;border:3px solid #111;position:relative}.face:before{content:'•  •';position:absolute;left:7px;top:7px;font-size:13px;letter-spacing:7px}.face:after{content:'⌣';position:absolute;left:11px;top:20px;font-size:14px}.owned{border-color:#8fd}.selected{outline:2px solid #ffe36e}.price{font-size:12px;color:#ffd95a}#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0009;padding:9px 14px;border-radius:10px;text-align:center;font-size:14px}#start{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:5}#card{max-width:440px;margin:20px;padding:28px;background:#182018;border:1px solid #5c7;border-radius:18px;text-align:center}button{font-size:16px;font-weight:bold;padding:9px 15px;border:0;border-radius:9px;background:#e8c44a;cursor:pointer}h1{margin-top:0}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel">❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="ammo">12</span></div><div class="panel">Wave <span id="wave">1</span> &nbsp; Zombies: <span id="count">0</span> &nbsp; 💰 <span id="money">0</span></div></div>
<div id="shop"><h2>🎭 SKIN SHOP</h2><div id="skins"></div></div>
<div id="pause" style="display:none;position:fixed;inset:0;z-index:4;place-items:center;background:#0008;text-align:center;pointer-events:none"><div class="panel"><h1>🌊 WAVE KLAAR!</h1><p>Nieuwe wave over <b id="timer">10</b> seconden...</p></div></div>
<div id="help">WASD = bewegen · muis = richten · klik = schieten · R = herladen</div>
<div id="start"><div id="card"><h1>🧟 ZOMBIE STORM</h1><p>Overleef zoveel mogelijk golven zombies. Verdien geld en verander je gezicht/skin in de shop.</p><button id="play">START GAME</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,keys={},mouse={x:0,y:0},player,zombies=[],bullets=[],wave=1,money=0,running=false,last=0,spawned=0,shootCooldown=0,reloading=false,selected=0,owned=[true,false,false,false,false,false],wavePause=0;
const skins=[{name:'Blauw',cost:0,body:'#4a77c9',skin:'#f2c29b',eyes:'normal',mouth:'smile'},{name:'Rood',cost:100,body:'#d84b4b',skin:'#f2c29b',eyes:'angry',mouth:'grin'},{name:'Goud',cost:300,body:'#e8b936',skin:'#f2c29b',eyes:'cool',mouth:'smile'},{name:'Neon',cost:750,body:'#39d98a',skin:'#8fd3ff',eyes:'star',mouth:'grin'},{name:'Robot',cost:1200,body:'#9aa4ad',skin:'#b8c0c8',eyes:'robot',mouth:'robot'},{name:'Demon',cost:2000,body:'#7b35b2',skin:'#d85a65',eyes:'demon',mouth:'grin'}];
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',resize);resize();
function renderShop(){document.getElementById('skins').innerHTML=skins.map((s,i)=>`<div class="skin ${owned[i]?'owned':''} ${selected===i?'selected':''}" data-i="${i}"><div class="face" style="background:${s.skin}"></div><b>${s.name}</b><div class="price">${owned[i]?(selected===i?'GESELECTEERD':'KIES'):s.cost+' 💰'}</div></div>`).join('');document.querySelectorAll('.skin').forEach(el=>el.onclick=()=>buySkin(+el.dataset.i))}
function buySkin(i){if(owned[i]){selected=i;renderShop();return}if(money>=skins[i].cost){money-=skins[i].cost;owned[i]=true;selected=i;renderShop()}}
renderShop();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',()=>shoot());document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';start()};
function start(){player={x:W/2,y:H/2,r:17,hp:100,ammo:12,maxAmmo:12,speed:260};zombies=[];bullets=[];wave=1;money=0;spawned=0;wavePause=0;running=true;last=performance.now();requestAnimationFrame(loop)}
function spawn(){let side=Math.floor(Math.random()*4),px=side===0?Math.random()*W:side===1?W:side===2?Math.random()*W:0,py=side===0?0:side===1?Math.random()*H:side===2?H:Math.random()*H;let boss=wave%15===0&&spawned===0,baseHp=40+wave*7;zombies.push({x:px,y:py,r:boss?29:16+Math.random()*6,hp:boss?baseHp*2:baseHp,maxHp:boss?baseHp*2:baseHp,speed:boss?38+wave*2:45+Math.random()*25+wave*3,hit:0,boss})}
function shoot(){if(!running||wavePause>0||reloading||shootCooldown>0)return;if(player.ammo<=0){reload();return}let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*720,vy:Math.sin(a)*720,r:4,life:1});player.ammo--;shootCooldown=.16}
function reload(){if(!running||reloading||player.ammo===player.maxAmmo)return;reloading=true;setTimeout(()=>{player.ammo=player.maxAmmo;reloading=false},700)}
function update(dt){if(wavePause>0){wavePause=Math.max(0,wavePause-dt);document.getElementById('timer').textContent=Math.ceil(wavePause);if(wavePause===0){document.getElementById('pause').style.display='none';wave++;spawned=0}return}let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(18,Math.min(W-18,player.x+dx/l*player.speed*dt));player.y=Math.max(18,Math.min(H-18,player.y+dy/l*player.speed*dt));shootCooldown=Math.max(0,shootCooldown-dt);
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const z of zombies){if(z.hp>0&&Math.hypot(b.x-z.x,b.y-z.y)<z.r+b.r){z.hp-=35;b.life=0;if(z.hp<=0){let drop=z.boss?100+Math.floor(Math.random()*101):5+Math.floor(Math.random()*6);money+=drop}}}}bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const z of zombies){if(z.hp<=0)continue;let a=Math.atan2(player.y-z.y,player.x-z.x),d=Math.hypot(player.x-z.x,player.y-z.y);if(d>z.r+player.r-3){z.x+=Math.cos(a)*z.speed*dt;z.y+=Math.sin(a)*z.speed*dt}else{z.hit-=dt;if(z.hit<=0){player.hp-=z.boss?14:8;z.hit=z.boss?.7:.55}}}zombies=zombies.filter(z=>z.hp>0);if(player.hp<=0){running=false;document.getElementById('card').innerHTML='<h1>☠️ GAME OVER</h1><p>Golven: '+wave+' · Geld: '+money+'</p><button id="play">OPNIEUW</button>';document.getElementById('start').style.display='grid';document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';start()}}let target=wave*5;if(spawned<target){spawn();spawned++}else if(zombies.length===0){wavePause=10;document.getElementById('timer').textContent='10';document.getElementById('pause').style.display='grid'}}
function drawFace(s){x.fillStyle=s.skin;x.beginPath();x.arc(0,0,13,0,7);x.fill();x.fillStyle='#222';if(s.eyes==='cool'){x.fillRect(-9,-5,7,4);x.fillRect(2,-5,7,4)}else if(s.eyes==='angry'){x.rotate(.15);x.fillRect(-9,-5,7,3);x.fillRect(2,-5,7,3);x.rotate(-.15)}else if(s.eyes==='robot'){x.fillStyle='#48e6ff';x.fillRect(-8,-5,5,4);x.fillRect(3,-5,5,4)}else if(s.eyes==='star'){x.font='10px Arial';x.fillText('★',-10,-3);x.fillText('★',3,-3)}else if(s.eyes==='demon'){x.fillStyle='#ffe36e';x.fillRect(-9,-5,7,4);x.fillRect(2,-5,7,4)}else{x.beginPath();x.arc(-5,-3,2,0,7);x.arc(5,-3,2,0,7);x.fill()}x.strokeStyle='#222';x.lineWidth=2;x.beginPath();if(s.mouth==='robot')x.rect(-6,5,12,4);else if(s.mouth==='grin'){x.moveTo(-7,5);x.quadraticCurveTo(0,11,7,5)}else{x.moveTo(-5,5);x.quadraticCurveTo(0,8,5,5)}x.stroke()}
function draw(){x.clearRect(0,0,W,H);for(let i=0;i<70;i++){let px=(i*137)%W,py=(i*83)%H;x.fillStyle=i%2?'#3b5d35':'#29452a';x.fillRect(px,py,3,3)}for(const b of bullets){x.fillStyle='#ffe36e';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}for(const z of zombies){x.save();x.translate(z.x,z.y);x.fillStyle=z.boss?'#8b2635':'#6c9b54';x.beginPath();x.arc(0,0,z.r,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(-z.r*.3,-z.r*.18,z.boss?5:3,0,7);x.arc(z.r*.3,-z.r*.18,z.boss?5:3,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=z.boss?5:3;x.beginPath();x.moveTo(-z.r*.35,z.r*.4);x.lineTo(z.r*.35,z.r*.4);x.stroke();if(z.boss){x.fillStyle='#f4d35e';x.font='bold 14px Arial';x.textAlign='center';x.fillText('BAAS',0,-z.r-8);x.fillStyle='#111';x.fillRect(-30,-z.r-24,60,6);x.fillStyle='#e33';x.fillRect(-30,-z.r-24,60*Math.max(0,z.hp/z.maxHp),6)}x.restore()}if(player){let s=skins[selected],a=Math.atan2(mouse.y-player.y,mouse.x-player.x);x.save();x.translate(player.x,player.y);x.rotate(a);x.fillStyle=s.body;x.beginPath();x.arc(0,0,player.r,0,7);x.fill();drawFace(s);x.fillStyle='#333';x.fillRect(7,-5,25,10);x.fillStyle='#ddd';x.fillRect(27,-4,9,8);x.restore()}}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('ammo').textContent=reloading?'...':player.ammo;document.getElementById('wave').textContent=wave;document.getElementById('count').textContent=zombies.length;document.getElementById('money').textContent=money;requestAnimationFrame(loop)}
</script></body></html>
